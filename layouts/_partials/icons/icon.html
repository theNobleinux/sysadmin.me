{{ $name := .name }}
{{ $class := .class | default "relative z-10 size-4 shrink-0" }}
<svg class="{{ $class }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {{ if eq $name "document" }}
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
    <path d="M14 2v6h6M8 13h8M8 17h8"/>
  {{ else if eq $name "mail" }}
    <rect x="3" y="5" width="18" height="14" rx="2"/>
    <path d="m3 7 9 6 9-6"/>
  {{ else if eq $name "code" }}
    <path d="m8 8-4 4 4 4M16 8l4 4-4 4M14 5l-4 14"/>
  {{ else if eq $name "network" }}
    <circle cx="6" cy="12" r="2"/>
    <circle cx="18" cy="6" r="2"/>
    <circle cx="18" cy="18" r="2"/>
    <path d="m8 11 8-4M8 13l8 4"/>
  {{ else if eq $name "arrow-right" }}
    <path d="M5 12h14M13 6l6 6-6 6"/>
  {{ end }}
</svg>
