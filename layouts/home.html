{{ define "main" }}
<section class="hero">
  <h1>{{ site.Title }}</h1>
  <p>{{ site.Params.description | default "Systems and infrastructure engineering." }}</p>
</section>

<section>
  <h2>Recent work</h2>
  <ul>
    {{ range where site.RegularPages "Type" "!=" "" }}
      <li><a href="{{ .Permalink }}">{{ .Title }}</a></li>
    {{ end }}
  </ul>
</section>
{{ end }}
